<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Catálogo de Cervezas</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #1c1a14;
    color: #f0ece0;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }

  .app { max-width: 680px; margin: 0 auto; }

  header {
    border-bottom: 2px solid #f0ece0;
    padding-bottom: 1.25rem;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 2.6rem;
    font-weight: normal;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header p {
    font-size: 1rem;
    color: #a89f88;
    margin-top: 0.5rem;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.04em;
  }

  .select-wrap { margin-bottom: 2rem; }

  label.field-label {
    display: block;
    font-size: 0.85rem;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a89f88;
    margin-bottom: 0.5rem;
  }

  select {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1.05rem;
    font-family: 'Georgia', serif;
    background: #2a2720;
    color: #f0ece0;
    border: 1.5px solid #f0ece0;
    border-radius: 0;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%23f0ece0' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  select:focus { outline: none; border-color: #e8a830; }

  select option { background: #2a2720; color: #f0ece0; }

  .empty-msg {
    font-size: 1rem;
    color: #6b6455;
    font-family: 'Courier New', monospace;
    padding: 1rem 0;
  }

  .count-line {
    font-size: 0.85rem;
    font-family: 'Courier New', monospace;
    color: #a89f88;
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 1px;
    border: 1.5px solid #f0ece0;
    background: #f0ece0;
  }

  .card {
    background: #1c1a14;
    padding: 1.2rem 1.1rem 1rem;
    transition: background 0.15s;
  }

  .card:hover { background: #2a2720; }

  .card-nombre {
    font-size: 1.05rem;
    font-weight: bold;
    line-height: 1.3;
    margin-bottom: 0.6rem;
    color: #f0ece0;
  }

  .card-detail {
    font-size: 0.88rem;
    font-family: 'Courier New', monospace;
    color: #a89f88;
    margin-bottom: 0.6rem;
  }

  /* ── Badges por tipo de presentacion ── */
  .badge {
    display: inline-block;
    font-size: 0.85rem;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1.5px solid;
    font-weight: bold;
  }

  .badge-artesanal { background: #1a3d22; border-color: #4daa64; color: #4daa64; }
  .badge-oscura  { background: #1e3d28; border-color: #80c494; color: #80c494; }
  .badge-light    { background: #0f2d40; border-color: #4d9fd6; color: #4d9fd6; }
  .badge-preparada  { background: #3d2a00; border-color: #e8a830; color: #e8a830; }
  .badge-NA      { background: #252318; border-color: #555047; color: #888070; }

  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid #333028;
    font-size: 0.8rem;
    font-family: 'Courier New', monospace;
    color: #555047;
  }
</style>
</head>

// Etiqueta legible para cada tipo
var TIPO_LABEL = {
  "artesanal":     "artesanal",
  "oscura": "oscura",
  "clara":        "clara",
  "light":      "light",
  "preparada":     "preparada",
  "NA": "NA"
};
// Clase CSS correspondiente
var TIPO_CLASS = {
  "artesanal":     "artesanal",
  "oscura": "oscura",
  "clara":        "clara",
  "light":      "light",
  "preparada":     "preparada",
  "NA": "NA"
};

function badgeHTML(tipo) {
  var isNA = (tipo == null || tipo === "" || tipo === "NA");
  var label = isNA ? "S/D" : (TIPO_LABEL[tipo] || tipo);
  var cls   = isNA ? "NA"  : (TIPO_CLASS[tipo] || "NA");
  return '<span class="badge badge-' + cls + '">' + label + '</span>';
}

function mostrar() {
  var marca  = document.getElementById("marca").value;
  var target = document.getElementById("resultado");

  if (!marca) {
    target.innerHTML = '<p class="empty-msg">Selecciona una marca para ver sus presentaciones.</p>';
    return;
  }

  var items = DATA[marca] || [];
  var n = items.length;

  var countLine = '<p class="count-line">' + n +
    ' presentación' + (n !== 1 ? "es" : "") +
    ' disponible' + (n !== 1 ? "s" : "") + '</p>';

  var cards = items.map(function(p) {
    return '<div class="card">' +
      '<div class="card-nombre">' + p.envase + "</div>" +
      '<div class="card-detail">Volumen (ml): ' + (p.vol_ml_u || "—") + " x " + 
      (p.conten_uni || "—") + '</div>' +
      badgeHTML(p.presentacion) +
      '</div>';
  }).join("");

  target.innerHTML = countLine + '<div class="cards">' + cards + '</div>';
}</script>
